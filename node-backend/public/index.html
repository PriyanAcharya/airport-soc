<!DOCTYPE html>
<html>
<head>
    <title>Airport SOC Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        h1 {
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 180px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin: 0;
            font-size: 16px;
        }

        .card p {
            font-size: 28px;
            margin: 10px 0 0 0;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #efefef;
        }

        .high {
            color: red;
            font-weight: bold;
        }

        .medium {
            color: orange;
            font-weight: bold;
        }

        .low {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>🛡️ Airport SOC Dashboard</h1>

<div class="cards">
    <div class="card">
        <h2>Total Alerts</h2>
        <p id="totalAlerts">0</p>
    </div>

    <div class="card">
        <h2>High Severity</h2>
        <p id="highAlerts">0</p>
    </div>

    <div class="card">
        <h2>Medium Severity</h2>
        <p id="mediumAlerts">0</p>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Timestamp</th>
            <th>MITRE</th>
            <th>Type</th>
            <th>Source IP</th>
            <th>Severity</th>
        </tr>
    </thead>

    <tbody id="alertsTable"></tbody>
</table>

<script>

async function loadAlerts() {

    const response = await fetch("/alerts");
    const alerts = await response.json();

    const table = document.getElementById("alertsTable");

    document.getElementById("totalAlerts").innerText =
        alerts.length;

    document.getElementById("highAlerts").innerText =
        alerts.filter(a => a.severity === "High").length;

    document.getElementById("mediumAlerts").innerText =
        alerts.filter(a => a.severity === "Medium").length;

    alerts.forEach(alert => {

        let mitre = "Unknown";

        if (alert.type === "Reconnaissance") {
            mitre = "T1595";
        }

        if (alert.type === "Port Scan") {
            mitre = "T1046";
        }

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${alert.id}</td>
            <td>${alert.timestamp || "-"}</td>
            <td>${mitre}</td>
            <td>${alert.type}</td>
            <td>${alert.source_ip}</td>
            <td class="${alert.severity.toLowerCase()}">
                ${alert.severity}
            </td>
        `;

        table.appendChild(row);
    });
}

loadAlerts();

</script>

</body>
</html>
